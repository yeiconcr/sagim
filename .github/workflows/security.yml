name: Security Audit

on:
  schedule:
    # Run every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  push:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  npm-audit:
    name: NPM Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run npm audit
        run: npm audit --audit-level=high --json > npm-audit.json || true

      - name: Display audit summary
        run: |
          echo "## NPM Audit Results" >> $GITHUB_STEP_SUMMARY
          if [ -f npm-audit.json ]; then
            VULNS=$(cat npm-audit.json | jq '.metadata.vulnerabilities // {}')
            echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Critical | $(echo $VULNS | jq '.critical // 0') |" >> $GITHUB_STEP_SUMMARY
            echo "| High     | $(echo $VULNS | jq '.high // 0') |" >> $GITHUB_STEP_SUMMARY
            echo "| Moderate | $(echo $VULNS | jq '.moderate // 0') |" >> $GITHUB_STEP_SUMMARY
            echo "| Low      | $(echo $VULNS | jq '.low // 0') |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail on critical/high vulnerabilities
        run: |
          if [ -f npm-audit.json ]; then
            CRITICAL=$(cat npm-audit.json | jq '.metadata.vulnerabilities.critical // 0')
            HIGH=$(cat npm-audit.json | jq '.metadata.vulnerabilities.high // 0')
            if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
              echo "Found $CRITICAL critical and $HIGH high vulnerabilities"
              exit 1
            fi
          fi

  rust-audit:
    name: Rust Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-action@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo audit
        working-directory: src-tauri
        run: cargo audit --json > cargo-audit.json || true

      - name: Display Rust audit summary
        working-directory: src-tauri
        run: |
          echo "## Cargo Audit Results" >> $GITHUB_STEP_SUMMARY
          if [ -f cargo-audit.json ]; then
            VULNS=$(cat cargo-audit.json | jq '.vulnerabilities.count // 0')
            echo "Found $VULNS vulnerabilities in Rust dependencies" >> $GITHUB_STEP_SUMMARY
          fi

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0
